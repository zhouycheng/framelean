name: Build macOS

on:
  push:
    branches: [develop/next]
  pull_request:
    branches: [develop/next]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install static libav build tools
        run: brew install autoconf automake libtool nasm pkg-config

      - name: Cache static libav SDK
        uses: actions/cache@v4
        with:
          path: build/dependencies/ffmpeg
          key: ffmpeg-static-macos-${{ runner.arch }}-${{ hashFiles('scripts/build/build_ffmpeg_macos_arch.sh') }}

      - name: Build, test, and package
        run: scripts/build/package_macos.sh

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: FrameLean-macos-${{ runner.arch }}
          path: build/packages/FrameLean-macos-*.zip
          if-no-files-found: error
          retention-days: 14
