name: Build Windows

on:
  push:
    branches: [develop/next]
  pull_request:
    branches: [develop/next]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Rust Windows GNU target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gdb
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-libtool
            mingw-w64-x86_64-binutils
            make
            autoconf
            automake
            git
            curl
            tar

      - name: Cache static libav SDK
        id: libav-cache
        uses: actions/cache/restore@v4
        with:
          path: build/dependencies/ffmpeg/windows-x64
          key: ffmpeg-static-windows-${{ hashFiles('scripts/build/build_ffmpeg_windows_x64.sh') }}

      - name: Build Rust runtime in MSYS2
        shell: msys2 {0}
        run: bash scripts/build/build_runtime_windows.sh

      - name: Save completed static libav SDK
        if: >-
          ${{ !cancelled() && steps.libav-cache.outputs.cache-hit != 'true' &&
              hashFiles('build/dependencies/ffmpeg/windows-x64/ffmpeg-build-info.txt') != '' }}
        uses: actions/cache/save@v4
        with:
          path: build/dependencies/ffmpeg/windows-x64
          key: ${{ steps.libav-cache.outputs.cache-primary-key }}

      - name: Diagnose native media test failure
        if: failure()
        shell: msys2 {0}
        run: |
          test_binary=$(find fll/target/x86_64-pc-windows-gnu/debug/deps -name 'media_frames_real-*.exe' -print -quit)
          if [[ -n "$test_binary" ]]; then
            gdb --batch -ex run -ex 'thread apply all bt' --args "$test_binary" --nocapture
          fi

      - name: Analyze, smoke-test, and package
        shell: pwsh
        run: ./scripts/build/package_windows.ps1

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: FrameLean-windows-x64
          path: build/packages/FrameLean-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
