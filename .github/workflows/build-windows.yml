name: Build Windows

on:
  push:
    branches: [develop/next]
  pull_request:
    branches: [develop/next]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Rust Windows GNU target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-libtool
            mingw-w64-x86_64-binutils
            make
            autoconf
            automake
            git
            curl
            tar

      - name: Cache static libav SDK
        uses: actions/cache@v4
        with:
          path: build/dependencies/ffmpeg/windows-x64
          key: ffmpeg-static-windows-${{ hashFiles('scripts/build/build_ffmpeg_windows_x64.sh') }}

      - name: Build Rust runtime in MSYS2
        shell: msys2 {0}
        run: bash scripts/build/build_runtime_windows.sh

      - name: Analyze, smoke-test, and package
        shell: pwsh
        run: ./scripts/build/package_windows.ps1

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: FrameLean-windows-x64
          path: build/packages/FrameLean-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
