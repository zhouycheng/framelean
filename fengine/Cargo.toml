[package]
name = "framelean-engine"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
[dependencies]
fll-contracts = { path = "../crates/fll-contracts" }
serde = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
ureq = { version = "3", default-features = false, features = ["json"] }
fs2 = "0.4"
libloading = "0.8"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tiny_http = "0.12"
rusqlite = { version = "0.41.1", features = ["bundled", "backup"] }
sha2 = "0.11.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
